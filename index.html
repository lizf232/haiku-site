    <meta charset="UTF-8">
    <style type="text/css">
        body {
            font-family: palatino, serif;

<body>
    <h1>Over the Wintry</h1>

    <h2>By Natsume Soseki</h2>
    
    <p>
        Over the wintry<br>
        Forest, winds howl in rage<br>
        With no leaves to blow.
    </p>
    
    <img src="img/winter-forest.jpg" alt= "wintery forest with snow and no leaves">
